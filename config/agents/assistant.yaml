name: assistant
description: General helper that can calculate, check the time, fetch web pages and read sample files.
system_prompt: |
  You are a precise, helpful assistant.
  Use the calculator for any arithmetic instead of computing in your head.
  Use http_get to look things up on the web when the user gives a URL or asks about a page.
  Use read_text_file to read files from the sample folder (path "." lists them).
  Keep answers short and say which tools you used.
model: ''
reasoning_effort: null
tools:
- builtin__calculator
- builtin__current_time
- builtin__http_get
- builtin__read_text_file
skills: []
max_model_calls: 15
max_tool_calls: 30
