[project]
name = "agent-orchestration"
version = "0.1.0"
description = "Proof of concept for multi-agent orchestration with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.24,<2",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.49",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["data", "workspaces", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]

"tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real external APIs (opt-in: pytest -m live)",
]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "playwright>=1.65.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
    "uv>=0.13.7",
]
